name: Test and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true
      - name: Install the project
        run: uv sync --all-extras --dev

      # Install and run pre-commit
      - run: |
          uv run pre-commit install
          uv run pre-commit install --hook-type commit-msg
          uv run pre-commit run --all-files

  pytest:
    name: Pytest ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        config:
        - {
            name: "Linux",
            os: ubuntu-latest
          }
        - {
            name: "MacOSX",
            os: macos-latest
          }
        - {
            name: "Windows",
            os: windows-latest
          }

    defaults:
      run:
        shell: bash

    env:
      UV_PYTHON: ${{ matrix.python-version }}


    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.24"
        enable-cache: true

    - name: Install the project
      run: uv sync --all-extras --dev

    - name: Run tests
      run: uv run pytest -s ./tests --cov=src --cov-report=xml

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3

  test-npm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Vue2 Components
        run: |
          cd vue2
          npm ci
          npm run build

      - name: Build Vue3 Components
        run: |
          cd vue3
          npm ci
          npm run build

  release:
    needs: [pre-commit, pytest, test-npm-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    environment:
        name: pypi
        url: https://pypi.org/p/trame-router
    permissions:
          id-token: write # IMPORTANT: mandatory for trusted publishing
          contents: write # IMPORTANT: mandatory for making GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Vue2 Components
        run: |
          cd vue2
          npm ci
          npm run build

      - name: Build Vue3 Components
        run: |
          cd vue3
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true

      - name: Python Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from "python-semantic-release==10.6.2" --with pip semantic-release -v version --commit --tag --vcs-release --changelog

      - name: Publish package distributions to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
